name: Windows release validation

on:
  workflow_dispatch:
    inputs:
      publish_beta:
        description: 'Retain an explicitly unsigned owner-authorized beta for 1 day'
        required: true
        default: false
        type: boolean
      beta_version:
        description: 'Numeric Windows beta version'
        required: true
        default: '0.1.0'
        type: string
      build_store_candidate:
        description: 'Retain a Partner Center-bound MSIX candidate for 1 day'
        required: true
        default: false
        type: boolean
      store_version:
        description: 'Four-component Store version ending in .0'
        required: true
        default: '0.1.0.0'
        type: string
      store_identity_name:
        description: 'Exact Partner Center Package/Identity/Name'
        required: false
        type: string
      store_publisher:
        description: 'Exact Partner Center Package/Identity/Publisher'
        required: false
        type: string
      store_publisher_display_name:
        description: 'Exact Partner Center PublisherDisplayName'
        required: false
        type: string
      store_authorization_reference:
        description: 'Partner Center product or reservation reference'
        required: false
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: windows-release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-validation:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'windows-release-validation'
    # v143 is the committed native toolchain; windows-2025 moved to VS 2026.
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact source and pinned whisper.cpp
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Assert pristine source before generating artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dirty = @(& git status --porcelain --untracked-files=all)
          if ($LASTEXITCODE) { throw 'Unable to inspect checkout cleanliness.' }
          if ($dirty.Count -ne 0) { throw "Checkout is not pristine:`n$($dirty -join "`n")" }

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.401

      - name: Install Node.js for portable contracts
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Record ephemeral host inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture
          dotnet --info
          node --version
          cmake --version
          git -C Vendor/whisper.cpp rev-parse HEAD

      - name: Restore locked managed graph
        working-directory: Windows
        run: dotnet restore Resenha.Windows.sln --locked-mode

      - name: Verify managed formatting
        working-directory: Windows
        run: dotnet format Resenha.Windows.sln --verify-no-changes --no-restore

      - name: Build managed Windows solution
        working-directory: Windows
        run: dotnet build Resenha.Windows.sln --configuration Release --no-restore --no-incremental -warnaserror

      - name: Run portable Core tests
        working-directory: Windows
        run: dotnet test Resenha.Core.Tests/Resenha.Core.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run portable Platform tests on Windows
        working-directory: Windows
        run: dotnet test Resenha.Platform.Tests/Resenha.Platform.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=Portable|TestCategory=PortableAudio"

      - name: Run Windows integration tests
        if: ${{ always() }}
        working-directory: Windows
        run: dotnet test Resenha.Platform.Tests/Resenha.Platform.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=WindowsIntegration"

      - name: Run Windows native audio conversion tests
        if: ${{ always() }}
        working-directory: Windows
        run: dotnet test Resenha.Platform.Tests/Resenha.Platform.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=WindowsNativeAudio"

      - name: Publish unsigned self-contained smoke payload
        if: ${{ always() }}
        working-directory: Windows
        shell: pwsh
        run: |
          dotnet publish Resenha.Windows/Resenha.Windows.csproj --configuration Release --no-restore --no-build --runtime win-x64 --self-contained true --output ../artifacts/cloud-smoke/app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish Resenha.TargetBroker/Resenha.TargetBroker.csproj --configuration Release --no-restore --no-build --runtime win-x64 --self-contained true --output ../artifacts/cloud-smoke/broker
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build pinned whisper.cpp CLI
        if: ${{ always() }}
        working-directory: Windows/native
        shell: pwsh
        run: |
          cmake --preset windows-x64-cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset windows-x64-cpu
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'build/windows-x64-cpu/bin/Release/whisper-cli.exe' -PathType Leaf)) {
            throw 'whisper-cli.exe was not produced.'
          }

      - name: Compile install and remove unsigned smoke installer
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-BoundedProcess([string]$Name, [string]$FilePath, [string[]]$Arguments, [int]$TimeoutSeconds) {
            Write-Host "Starting: $Name"
            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
              throw "$Name exceeded ${TimeoutSeconds}s."
            }
            if ($process.ExitCode -ne 0) { throw "$Name failed: $($process.ExitCode)" }
            Write-Host "Completed: $Name"
          }
          $toolUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $toolSha256 = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $toolInstaller = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $toolRoot = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3'
          Invoke-WebRequest -Uri $toolUrl -OutFile $toolInstaller
          if ((Get-FileHash -LiteralPath $toolInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -ne $toolSha256) {
            throw 'Pinned Inno Setup installer hash mismatch.'
          }
          $signature = Get-AuthenticodeSignature -FilePath $toolInstaller
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw 'Pinned Inno Setup installer signature is not trusted.'
          }
          Invoke-BoundedProcess 'Inno Setup installation' $toolInstaller @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$toolRoot") 90
          $iscc = Join-Path $toolRoot 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw 'Pinned ISCC.exe is missing.' }

          $payload = Join-Path $env:RUNNER_TEMP 'resenha-cloud-smoke-payload'
          $output = Join-Path $env:RUNNER_TEMP 'resenha-cloud-smoke-installer'
          New-Item -ItemType Directory -Path $payload, $output -Force | Out-Null
          Copy-Item -Path 'artifacts/cloud-smoke/app/*' -Destination $payload -Recurse -Force
          Copy-Item -Path 'artifacts/cloud-smoke/broker/*' -Destination $payload -Recurse -Force
          New-Item -ItemType Directory -Path (Join-Path $payload 'native'), (Join-Path $payload 'licenses') -Force | Out-Null
          Copy-Item -LiteralPath 'Windows/native/build/windows-x64-cpu/bin/Release/whisper-cli.exe' -Destination (Join-Path $payload 'native/whisper-cli.exe')
          Get-ChildItem -LiteralPath 'Windows/native/build/windows-x64-cpu/bin/Release' -Filter '*.dll' | Copy-Item -Destination (Join-Path $payload 'native')
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $payload 'licenses/Resenha-MIT.txt')
          Copy-Item -LiteralPath 'THIRD_PARTY_NOTICES.md' -Destination (Join-Path $payload 'licenses')
          Copy-Item -LiteralPath 'Vendor/whisper.cpp/LICENSE' -Destination (Join-Path $payload 'licenses/whisper.cpp-MIT.txt')

          $publishBeta = '${{ inputs.publish_beta }}' -eq 'true'
          $appVersion = if ($publishBeta) { '${{ inputs.beta_version }}' } else { '0.0.0' }
          if ($appVersion -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Beta version must be numeric SemVer.' }
          $modeDefine = if ($publishBeta) { '/DBetaUnsigned=1' } else { '/DSmokeUnsigned=1' }
          Invoke-BoundedProcess 'Inno smoke compilation' $iscc @("/DAppVersion=$appVersion", "/DPayloadDir=$payload", "/DOutputDir=$output", $modeDefine, 'Windows/Installer/Resenha.iss') 300
          $installerName = if ($publishBeta) { "Resenha-$appVersion-windows-x64-BETA-UNSIGNED.exe" } else { 'Resenha-0.0.0-windows-x64-UNSIGNED-NOT-FOR-DISTRIBUTION.exe' }
          $installer = Join-Path $output $installerName
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Unsigned smoke installer was not produced.' }
          if ((Get-AuthenticodeSignature -FilePath $installer).Status -ne 'NotSigned') { throw 'Smoke installer must remain unsigned.' }

          $installedRoot = Join-Path $env:RUNNER_TEMP 'resenha-installed-smoke'
          Invoke-BoundedProcess 'Resenha smoke installation' $installer @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installedRoot") 90
          foreach ($relative in @('Resenha.exe', 'Resenha.TargetBroker.exe', 'native/whisper-cli.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installedRoot $relative) -PathType Leaf)) { throw "Installed payload missing: $relative" }
          }
          $uninstaller = Join-Path $installedRoot 'unins000.exe'
          Invoke-BoundedProcess 'Resenha smoke uninstall' $uninstaller @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') 90
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path -LiteralPath $installedRoot); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath $installedRoot) { throw 'Smoke uninstall left the application directory behind.' }

          if ($publishBeta) {
            $betaRoot = 'artifacts/windows-beta'
            New-Item -ItemType Directory -Path $betaRoot -Force | Out-Null
            Copy-Item -LiteralPath $installer -Destination (Join-Path $betaRoot $installerName)
            $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $installerName" | Set-Content -LiteralPath (Join-Path $betaRoot "$installerName.sha256") -Encoding ascii -NoNewline
            [ordered]@{
              schemaVersion = 1
              channel = 'owner-authorized-unsigned-beta'
              version = $appVersion
              filename = $installerName
              sha256 = $hash
              sourceCommit = '${{ github.sha }}'
              signature = 'unsigned'
              cloudInstall = 'passed'
              cloudUninstall = 'passed'
              physicalWindows = 'pending'
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $betaRoot 'beta-evidence.json') -Encoding utf8NoBOM
          }

      - name: Build and validate synthetic Microsoft Store MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:RUNNER_TEMP 'resenha-msix-smoke-payload'
          $output = Join-Path $env:RUNNER_TEMP 'resenha-msix-smoke-output'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null
          Copy-Item -Path 'artifacts/cloud-smoke/app/*' -Destination $payload -Recurse -Force
          Copy-Item -Path 'artifacts/cloud-smoke/broker/*' -Destination $payload -Recurse -Force
          New-Item -ItemType Directory -Path (Join-Path $payload 'native'), (Join-Path $payload 'licenses') -Force | Out-Null
          Copy-Item -LiteralPath 'Windows/native/build/windows-x64-cpu/bin/Release/whisper-cli.exe' -Destination (Join-Path $payload 'native/whisper-cli.exe')
          Get-ChildItem -LiteralPath 'Windows/native/build/windows-x64-cpu/bin/Release' -Filter '*.dll' | Copy-Item -Destination (Join-Path $payload 'native')
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $payload 'licenses/Resenha-MIT.txt')
          Copy-Item -LiteralPath 'THIRD_PARTY_NOTICES.md' -Destination (Join-Path $payload 'licenses')
          Copy-Item -LiteralPath 'Vendor/whisper.cpp/LICENSE' -Destination (Join-Path $payload 'licenses/whisper.cpp-MIT.txt')
          & 'Scripts/windows/build-msix.ps1' -Mode synthetic-smoke -Version '0.1.0.0' -PayloadDir $payload -OutputDir $output
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $package = Join-Path $output 'Resenha-0.1.0.0-windows-x64-SYNTHETIC-NOT-FOR-SUBMISSION.msix'
          if (-not (Test-Path -LiteralPath $package -PathType Leaf)) { throw 'Synthetic MSIX was not produced.' }
          if (Test-Path -LiteralPath 'artifacts/windows-msix') { throw 'Synthetic MSIX must remain ephemeral.' }

      - name: Build Partner Center-bound Microsoft Store candidate
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.build_store_candidate == true }}
        shell: pwsh
        env:
          STORE_VERSION: ${{ inputs.store_version }}
          STORE_IDENTITY_NAME: ${{ inputs.store_identity_name }}
          STORE_PUBLISHER: ${{ inputs.store_publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.store_publisher_display_name }}
          STORE_AUTHORIZATION_REFERENCE: ${{ inputs.store_authorization_reference }}
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:RUNNER_TEMP 'resenha-msix-smoke-payload'
          $output = 'artifacts/windows-store-candidate'
          & 'Scripts/windows/build-msix.ps1' -Mode store-candidate -Version $env:STORE_VERSION -PayloadDir $payload -OutputDir $output -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME -AuthorizationReference $env:STORE_AUTHORIZATION_REFERENCE
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-ChildItem -LiteralPath $output -Filter '*.msix' -File).Count -ne 1) { throw 'Exactly one Store candidate is required.' }

      - name: Run portable release and site contracts
        if: ${{ always() }}
        run: node --test Scripts/windows-docs.test.mjs Scripts/windows-release.test.mjs Scripts/site.test.mjs Windows/scaffold.test.mjs

      - name: Retain owner-authorized unsigned beta for transfer
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish_beta == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Resenha-Windows-Beta-${{ inputs.beta_version }}-${{ github.sha }}
          path: artifacts/windows-beta/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Retain Partner Center-bound Store candidate for transfer
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.build_store_candidate == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Resenha-Windows-Store-${{ inputs.store_version }}-${{ github.sha }}
          path: artifacts/windows-store-candidate/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
