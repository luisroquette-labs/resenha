name: Site tests

on:
  pull_request:
    paths:
      - '.github/workflows/site-tests.yml'
      - 'Scripts/site.mjs'
      - 'Scripts/site.test.mjs'
      - 'site/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-tests.yml'
      - 'Scripts/site.mjs'
      - 'Scripts/site.test.mjs'
      - 'site/**'

permissions:
  contents: read

concurrency:
  group: site-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install media inspection dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Run static site suite
        run: node Scripts/site.test.mjs
