name: Swift preflight

on:
  pull_request:
    paths:
      - '.github/workflows/swift-preflight.yml'
      - 'Package.swift'
      - 'Sources/**'
      - 'Tests/**'
      - 'WhisperKey.xcodeproj/**'

permissions:
  contents: read

concurrency:
  group: swift-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run canonical Swift preflight
        run: >-
          xcodebuild test -quiet
          -project WhisperKey.xcodeproj
          -scheme WhisperKey
          -destination 'platform=macOS'
