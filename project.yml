name: WhisperKey
options:
  bundleIdPrefix: br.com.luisroquette
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  WhisperKey:
    type: application
    platform: macOS
    sources:
      - path: Sources/WhisperKey
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - framework: Frameworks/whisper.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: libc++.tbd
    entitlements:
      path: Config/ResenhaStore.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.luisroquette.Resenha
        PRODUCT_NAME: Resenha
        PRODUCT_MODULE_NAME: WhisperKey
        DEVELOPMENT_TEAM: S3YCFYY8SC
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/ResenhaStore-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
  WhisperKeyTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests/WhisperKeyTests
    dependencies:
      - target: WhisperKey
    settings:
      base:
        DEVELOPMENT_TEAM: S3YCFYY8SC
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Resenha.app/Contents/MacOS/Resenha"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  WhisperKey:
    build:
      targets:
        WhisperKey: all
        WhisperKeyTests: [test]
    test:
      targets:
        - WhisperKeyTests
