<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180" role="img" aria-labelledby="title desc">
  <title id="title">resenha</title>
  <desc id="desc">Duas vozes em conversa formam o simbolo ao lado do nome resenha.</desc>

  <!-- O simbolo nasce de duas vozes espelhadas. A abertura central e a conversa. -->
  <g transform="translate(18 10)" fill="none" stroke="#101114" stroke-linecap="round">
    <path d="M50 35 C24 44 17 62 17 80 C17 98 24 116 50 125" stroke-width="10"/>
    <path d="M68 49 C49 57 44 68 44 80 C44 92 49 103 68 111" stroke-width="11"/>
    <path d="M110 35 C136 44 143 62 143 80 C143 98 136 116 110 125" stroke-width="10"/>
    <path d="M92 49 C111 57 116 68 116 80 C116 92 111 103 92 111" stroke-width="11"/>
  </g>
  <g transform="translate(18 10)" fill="#101114">
    <rect x="75" y="44" width="10" height="72" rx="5"/>
    <circle cx="80" cy="31" r="5"/>
    <circle cx="80" cy="129" r="5"/>
  </g>

  <!-- Wordmark: caixa baixa, proporcao larga e cortes opticos proprios. -->
  <text x="205" y="116" fill="#101114"
        font-family="Avenir Next, Avenir, Helvetica Neue, sans-serif"
        font-size="82" font-weight="700" letter-spacing="-3.8">resenha</text>
  <!-- Ponto final: o produto transforma fala em texto pronto. -->
  <circle cx="510" cy="109" r="5" fill="#101114"/>
</svg>
